name: Build Nuestr@ Casa APK

on:
  workflow_dispatch:
  push:
    branches: [ "nuestra-casa-builder" ]
    paths:
      - "household-app/**"
      - ".github/workflows/build-nuestra-casa.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: household-app
        run: gradle assembleDebug

      - name: Rename APK
        run: cp household-app/app/build/outputs/apk/debug/app-debug.apk HappyHome-v0.9.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HappyHome-v0.9-apk
          path: HappyHome-v0.9.apk
          retention-days: 30
