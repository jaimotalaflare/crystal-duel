<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HappyHome</title><style>
:root{--text:#20242d;--muted:#8b93a1;--line:#ececf2;--pink:#f6b7c9;--lav:#d8c9f4;--mint:#cceee2;--blue:#cfe4fb;--peach:#f8dfbf}*{box-sizing:border-box}body{margin:0;background:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text)}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;padding-bottom:94px}.top{position:sticky;top:0;z-index:5;background:#fffffff2;backdrop-filter:blur(14px);padding:20px 18px 13px;border-bottom:1px solid #f1f1f4;display:flex;justify-content:space-between}.eyebrow{font-size:12px;color:var(--muted);font-weight:600}.title{font-size:24px;font-weight:750;margin-top:2px}.avatar,.icon{border:0;width:40px;height:40px;border-radius:14px;background:#f7f7fa}.avatar{background:linear-gradient(135deg,var(--pink),var(--lav));color:#fff;font-weight:800}.screen{padding:16px 16px 110px}.hero{padding:20px;border-radius:26px;background:linear-gradient(135deg,#fff1f4,#f8f4ff 55%,#eef9f5);border:1px solid #f2e8ef}.hero h1{font-size:27px;line-height:1.08;margin:8px 0}.hero p,.small{font-size:12px;color:var(--muted)}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.house{width:82px;height:70px;border-radius:22px;background:#ffffffa8;display:grid;place-items:center;font-size:36px}.section{margin:24px 2px 10px;display:flex;justify-content:space-between;align-items:center}.section h3{font-size:17px;margin:0}.link{border:0;background:transparent;color:#718ed9;font-size:12px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.quick button{border:0;border-radius:18px;min-height:80px;background:#fff1f4}.quick button:nth-child(2){background:#f4f0ff}.quick button:nth-child(3){background:#eefaf5}.quick button:nth-child(4){background:#eef6ff}.quick b{display:block;font-size:22px;margin-bottom:6px}.card,.item{border:1px solid var(--line);border-radius:19px;background:#fff;padding:14px}.stack{display:grid;gap:9px}.item{display:flex;justify-content:space-between;align-items:cen dex:30}.sheet{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:28px 28px 0 0;padding:15px 16px 28px;z-index:40;max-height:85vh;overflow:auto}.hidden{display:none}.handle{width:46px;height:5px;background:#dddde5;border-radius:9px;margin:0 auto 14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.grid button{border:0;border-radius:18px;background:#fafafe;min-height:80px}.grid span{display:block;font-size:11px;margin-top:5px}.form{display:grid;gap:11px}.field label{font-size:12px;color:#626a76;font-weight:650;display:block;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;background:#fbfbfd;font-size:16px}.field textarea{min-height:80px}.primary{border:0;border-radius:14px;padding:12px 15px;color:#fff;background:linear-gradient(135deg,#e99ab3,#9d89e2);font-weight:650}.secondary{border:1px solid var(--line);border-radius:14px;padding:12px 15px;background:#fff}.clickable{cursor:pointer}.danger{color:#c84e61}.actions{display:flex;gap:8px;margin-top:14px}.actions button{flex:1}.meta{font-size:11px;color:var(--muted);margin-top:7px}.payrow,.itemrow{display:grid;grid-template-columns:1.2fr .7fr 1fr auto;gap:6px;align-items:end;margin:7px 0}.payrow input,.payrow select,.itemrow input{width:100%;box-sizing:border-box}.mini{padding:10px;border:1px solid var(--line);border-radius:12px;background:white}.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:#2d313b;color:#fff;padding:10px 14px;border-radius:12px;z-index:60;font-size:12px;white-space:nowrap}
</style></head><body><div class="app"><header class="top"><div><div class="eyebrow">HappyHome</div><div class="title" id="title">Inicio</div></div><div><button class="icon" id="bell">🔔</button> <button class="avatar" id="profile">N</button></div></header><main class="screen" id="screen"></main><nav class="nav"><button class="active" data-nav="inicio">🏠<small>Inicio</small></button><button data-nav="dinero">💰<small>Dinero</small></button><button class="fab" id="plus">＋</button><button data-nav="casa">🏡<small>Casa</small></button><button data-nav="familia">❤️<small>Familia</small></button></nav></div><div id="bg" class="sheetbg hidden"></div><section id="sheet" class="sheet hidden"></section><script>
const $=q=>document.querySelector(q), $$=q=>[...document.querySelectorAll(q)];
const money=n=>new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(Number(n)||0);
const now=()=>new Date().toLocaleString('es-CL',{dateStyle:'short',timeStyle:'short'});
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fresh=()=>({home:{name:'HappyHome',message:'Juntos hacemos un gran hogar.'},members:['Nicolás','Alejandra'],bills:[],purchases:[],savings:[],shopping:[],wishlist:[],inventory:{Refrigerador:[],Despensa:[],Otros:[]},tasks:[],notes:[],events:[],albums:[],chat:[]});
let s; try{s=JSON.parse(localStorage.getItem('happyhome-v04'))||fresh()}catch(e){s=fresh()}
let current='inicio', moneyTabName='cuentas', houseTabName='menu', familyTabName='fotos',calView=new Date();
function save(){localStorage.setItem('happyhome-v04',JSON.stringify(s))}
function audit(obj,text){obj.history??=[];obj.history.unshift({who:'Nicolás',at:now(),text})}
function toast(t){let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),1600)}
function sheet(h){$('#sheet').innerHTML=h;$('#sheet').classList.remove('hidden');$('#bg').classList.remove('hidden')}
function close(){$('#sheet').classList.add('hidden');$('#bg').classList.add('hidden')}
function hist(x){return (x.history||[]).map(h=>'<div class="activity"><strong>'+h.who+'</strong> · '+h.at+'<br><span class="small">'+h.text+'</span></div>').join('')||'<p class="small">Aún no hay movimientos.</p>'}
function empty(title,txt,action){return '<div class="card"><strong>'+title+'</strong><p class="small">'+txt+'</p>'+(action||'')+'</div>'}
function render(){ $$('.nav [data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===current)); ({inicio:home,dinero:moneyScreen,casa:house,familia:family}[current])(); bind() }
function home(){
 $('#title').textContent=s.home.name;
 const due=s.bills.filter(b=>b.status!=='Pagada').slice(0,3), tasks=s.tasks.filter(t=>!t.done).slice(0,3);
 $('#screen').innerHTML='<div class="hero clickable" data-homeedit="1"><div class="row"><div><div class="eyebrow">Nuestro hogar</div><h1>'+s.home.message+'</h1><p>Toca aquí para editar nombre y mensaje</p></div><div class="house">🏡</div></div></div>'+
 '<div class="section"><h3>Acciones rápidas</h3></div><div class="quick"><button data-add="compra"><b>🛒</b>Compra</button><button data-add="cuenta"><b>💳</b>Cuenta</button><button data-add="nota"><b>📝</b>Nota</button><button data-add="evento"><b>📅</b>Evento</button></div>'+
 '<div class="section"><h3>Próximo</h3></div><div class="stack">'+
 (due.length?due.map((b,i)=>'<div class="item clickable" data-bill="'+b.id+'"><div class="main"><div class="ico">💡</div><div class="copy"><strong>'+b.name+'</strong><small>Vence '+b.due+'</small></div></div><strong>'+money(b.amount-b.paid)+'</strong></div>').join(''):'')+
 (tasks.length?tasks.map(t=>'<div class="item clickable" data-task="'+t.id+'"><div class="main"><div class="ico">🔔</div><div class="copy"><strong>'+t.name+'</strong><small>'+t.when+' · '+t.who+'</small></div></div><span class="pill">Pendiente</span></div>').join(''):'')+
 (!due.length&&!tasks.length?empty('✨ Todo al día','Aquí aparecerán cuentas, tareas y recordatorios próximos.'):'')+'</div>'+
 '<div class="section"><h3>Metas de ahorro</h3><button class="link" data-add="meta">+ Nueva</button></div>'+
 (s.savings.length?'<div class="stack">'+s.savings.slice(0,3).map(g=>{let p=g.goal?Math.min(100,Math.round(g.balance/g.goal*100)):0;return '<div class="save clickable" data-saving="'+g.id+'"><div class="row"><div><strong>'+g.name+'</strong><div>'+money(g.balance)+'</div></div><strong>'+p+'%</strong></div><div class="progress"><div style="width:'+p+'%"></div></div></div>'}).join('')+'</div>':empty('💰 Sin metas todavía','Crea una meta y empieza a registrar movimientos.','<button class="primary" data-add="meta">Crear meta</button>'));
}
function moneyScreen(){
 $('#title').textContent='Dinero';
 $('#screen').innerHTML='<div class="tabs"><button data-m="cuentas">Cuentas</button><button data-m="compras">Compras</button><button data-m="ahorro">Ahorros</button></div><div id="panel"></div>';
 $$('.tabs [data-m]').forEach(b=>{b.classList.toggle('active',b.dataset.m===moneyTabName);b.onclick=()=>{moneyTabName=b.dataset.m;moneyScreen();bind()}});
 moneyPanel();
}
function moneyPanel(){
 let p=$('#panel'); if(!p)return;
 if(moneyTabName==='cuentas')p.innerHTML='<div class="section"><h3>Cuentas</h3><button class="link" data-add="cuenta">+ Agregar</button></div>'+(s.bills.length?'<div class="stack">'+s.bills.map(b=>'<div class="item clickable" data-bill="'+b.id+'"><div class="main"><div class="ico">💳</div><div class="copy"><strong>'+b.name+'</strong><small>'+b.due+' · Pagado '+money(b.paid)+'</small></div></div><div><strong>'+money(b.amount)+'</strong><br><span class="pill '+(b.status==='Pagada'?'green':'')+'">'+b.status+'</span></div></div>').join('')+'</div>':empty('No hay cuentas','Registra arriendo, luz, internet u otra cuenta.','<button class="primary" data-add="cuenta">Agregar primera cuenta</button>'));
 if(moneyTabName==='compras')p.innerHTML='<div class="section"><h3>Compras</h3><button class="link" data-add="compra">+ Registrar</button></div>'+(s.purchases.length?'<div class="stack">'+s.purchases.map(x=>'<div class="card clickable" data-purchase="'+x.id+'"><div class="row"><div><strong>'+x.name+'</strong><div class="small">'+x.place+' · '+x.date+'</div></div><strong>'+money(x.total)+'</strong></div><div class="small">'+x.items.length+' items · '+x.payments.map(p=>p.method+' '+money(p.amount)).join(' + ')+'</div></div>').join('')+'</div>':empty('No hay compras registradas','Una compra puede contener items, varios medios de pago y distintos pagadores.','<button class="primary" data-add="compra">Registrar compra</button>'));
 if(moneyTabName==='ahorro')p.innerHTML='<div class="section"><h3>Metas de ahorro</h3><button class="link" data-add="meta">+ Nueva meta</button></div>'+(s.savings.length?'<div class="stack">'+s.savings.map(g=>'<div class="card clickable" data-saving="'+g.id+'"><div class="row"><div><strong>'+g.name+'</strong><div class="small">'+money(g.balance)+' de '+money(g.goal)+'</div></div><strong>'+Math.round((g.balance/(g.goal||1))*100)+'%</strong></div><div class="progress"><div style="width:'+Math.min(100,Math.round(g.balance/(g.goal||1)*100))+'%"></div></div></div>').join('')+'</div>':empty('Sin metas','Puedes tener varias metas independientes.','<button class="primary" data-add="meta">Crear meta</button>'));
}
function house(){
 $('#title').textContent=houseTabName==='menu'?'Casa':houseTabName;
 let menu='<div class="tiles"><button class="tile" data-h="compras">🛒<b>Lista de compras</b><small>'+s.shopping.filter(x=>!x.done).length+' pendientes</small></button><button class="tile" data-h="wishlist">💝<b>Wishlist</b><small>'+s.wishlist.length+' deseos</small></button><button class="tile" data-h="Refrigerador">🧊<b>Refrigerador</b><small>'+s.inventory.Refrigerador.length+' items</small></button><button class="tile" data-h="Despensa">🥫<b>Despensa</b><small>'+s.inventory.Despensa.length+' items</small></button><button class="tile" data-h="Otros">📦<b>Otros</b><small>'+s.inventory.Otros.length+' items</small></button><button class="tile" data-h="tareas">✅<b>Tareas</b><small>'+s.tasks.filter(x=>!x.done).length+' pendientes</small></button><button class="tile" data-h="notas">📝<b>Notas</b><small>'+s.notes.length+' notas</small></button><button class="tile" data-h="calendario">📅<b>Calendario</b><small>'+s.events.length+' eventos</small></button></div>';
 $('#screen').innerHTML=houseTabName==='menu'?menu:'<button class="link" id="backhouse">← Volver a Casa</button><div id="hp"></div>';
 if(houseTabName==='menu'){$$('[data-h]').forEach(b=>b.onclick=()=>{houseTabName=b.dataset.h;house()})}else{$('#backhouse').onclick=()=>{houseTabName='menu';house()};housePanel();bind()}
}
function housePanel(){
 let p=$('#hp'); if(!p)return;
 if(houseTabName==='wishlist')p.innerHTML='<div class="section"><h3>Wishlist</h3><button class="link" data-add="wish">+ Agregar deseo</button></div>'+(s.wishlist.length?'<div class="stack">'+s.wishlist.map(w=>'<div class="card clickable" data-wish="'+w.id+'"><strong>'+w.name+'</strong><div class="small">'+w.quotes.length+' cotizaciones'+(w.quotes.length?' · desde '+money(Math.min(...w.quotes.map(q=>q.price))):'')+'</div></div>').join('')+'</div>':empty('Wishlist vacía','Guarda cosas que quieran comprar y compara cotizaciones.'));else if(houseTabName==='compras')p.innerHTML='<div class="section"><h3>Lista de compras</h3><button class="link" data-add="item">+ Agregar</button></div>'+(s.shopping.length?'<div class="card">'+s.shopping.map(x=>'<div class="activity clickable" data-shop="'+x.id+'"><span>'+(x.done?'✅':'⬜')+'</span> <strong>'+x.name+'</strong> ×'+x.qty+'</div>').join('')+'</div>':empty('Lista vacía','Agrega productos que necesiten comprar.'));
 else if(['Refrigerador','Despensa','Otros'].includes(houseTabName)){let a=s.inventory[houseTabName];p.innerHTML='<div class="section"><h3>'+houseTabName+'</h3><button class="link" data-addinv="'+houseTabName+'">+ Agregar</button></div>'+(a.length?'<div class="stack">'+a.map(x=>'<div class="item clickable" data-inv="'+houseTabName+'" data-id="'+x.id+'"><div class="main"><div class="ico">'+(houseTabName==='Refrigerador'?'🧊':houseTabName==='Despensa'?'🥫':'📦')+'</div><div class="copy"><strong>'+x.name+'</strong><small>'+x.qty+' · '+(x.expiry||'sin vencimiento')+'</small></div></div><span class="pill">'+x.status+'</span></div>').join('')+'</div>':empty('Inventario vacío','Puedes agregar manualmente o alimentar este inventario desde una compra.'))}
 else if(houseTabName==='tareas')p.innerHTML='<div class="section"><h3>Tareas</h3><button class="link" data-add="tarea">+ Tarea</button></div>'+(s.tasks.length?'<div class="stack">'+s.tasks.map(x=>'<div class="item clickable" data-task="'+x.id+'"><div><strong>'+(x.done?'✅ ':'')+x.name+'</strong><div class="small">'+x.when+' · '+x.who+'</div></div><span class="pill">'+(x.done?'Hecha':'Pendiente')+'</span></div>').join('')+'</div>':empty('Sin tareas','Crea tareas y asígnalas a miembros del hogar.'));
 else if(houseTabName==='notas')p.innerHTML='<div class="section"><h3>Notas</h3><button class="link" data-add="nota">+ Nota</button></div>'+(s.notes.length?'<div class="stack">'+s.notes.map(x=>'<div class="card clickable" data-note="'+x.id+'"><strong>'+x.title+'</strong><p class="small">'+x.body+'</p></div>').join('')+'</div>':empty('Sin notas','Guarda información útil de la casa.'));
 else if(houseTabName==='calendario') calendar(p);
}
function calendar(p){
 let d=calView,y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),today=new Date(),names=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];let cells=names.map(n=>'<div class="small" style="text-align:center"><b>'+n+'</b></div>').join('')+Array(first).fill('<div></div>').join('');
 for(let day=1;day<=days;day++){let key=y+'-'+String(m+1).padStart(2,'0')+'-'+String(day).padStart(2,'0'),ev=s.events.filter(e=>e.date===key),isToday=today.getFullYear()===y&&today.getMonth()===m&&today.getDate()===day;cells+='<div class="card clickable" data-day="'+key+'" style="padding:8px;min-height:58px;'+(isToday?'outline:2px solid #e985a6;background:#fff4f7':'')+'"><strong>'+day+(isToday?' · Hoy':'')+'</strong>'+ev.map(e=>'<div style="font-size:9px;margin-top:3px">● '+e.title+'</div>').join('')+'</div>'}
 p.innerHTML='<div class="section"><button class="secondary" id="prevcal">‹</button><h3>'+d.toLocaleString('es-CL',{month:'long',year:'numeric'})+'</h3><button class="secondary" id="nextcal">›</button></div><div class="row"><button class="link" id="todaycal">Hoy</button><button class="link" data-add="evento">+ Evento</button></div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">'+cells+'</div><div class="section"><h3>Eventos</h3></div>'+(s.events.length?'<div class="stack">'+s.events.filter(e=>new Date(e.date+'T00:00:00').getFullYear()===y&&new Date(e.date+'T00:00:00').getMonth()===m).map(e=>'<div class="item clickable" data-event="'+e.id+'"><div><strong>'+e.title+'</strong><div class="small">'+e.date+' '+e.time+' · '+e.guests.join(', ')+'</div></div><span class="pill">●</span></div>').join('')+'</div>':empty('Sin eventos','Toca un día para agregar uno.'));
 $('#prevcal').onclick=()=>{calView=new Date(y,m-1,1);calendar(p);bind()};$('#nextcal').onclick=()=>{calView=new Date(y,m+1,1);calendar(p);bind()};$('#todaycal').onclick=()=>{calView=new Date();calendar(p);bind()}
}
function family(){
 $('#title').textContent='Familia';
 $('#screen').innerHTML='<div class="tabs"><button data-f="fotos">Álbumes</button><button data-f="chat">Chat</button><button data-f="miembros">Miembros</button></div><div id="fp"></div>';
 $$('.tabs [data-f]').forEach(b=>{b.classList.toggle('active',b.dataset.f===familyTabName);b.onclick=()=>{familyTabName=b.dataset.f;family()}});
 let p=$('#fp');
 if(familyTabName==='fotos')p.innerHTML='<div class="section"><h3>Álbumes</h3><button class="link" data-add="album">+ Álbum</button></div>'+(s.albums.length?'<div class="tiles">'+s.albums.map(a=>'<button class="tile" data-album="'+a.id+'">📸<b>'+a.name+'</b><small>'+a.photos.length+' fotos</small></button>').join('')+'</div>':empty('Sin álbumes','Crea un álbum y agrega fotografías.'));
 if(familyTabName==='chat')p.innerHTML='<div class="section"><h3>Chat del hogar</h3></div><div class="card">'+(s.chat.map(x=>'<div class="activity"><strong>'+x.who+':</strong> '+x.text+'<div class="small">'+x.at+'</div></div>').join('')||'<p class="small">Sin mensajes.</p>')+'<div class="row" style="margin-top:10px"><input id="msg" style="flex:1;border:1px solid var(--line);border-radius:14px;padding:12px" placeholder="Mensaje"><button class="primary" id="send">Enviar</button></div></div>';
 if(familyTabName==='miembros')p.innerHTML='<div class="section"><h3>Miembros</h3><button class="link" id="addmember">+ Miembro</button></div><div class="card">'+s.members.map((x,i)=>'<div class="activity row"><span>👤 <strong>'+x+'</strong></span><button class="link" data-member="'+i+'">Editar</button></div>').join('')+'</div>';
 bind();
}
function form(type,preset){
 let h='<div class="handle"></div><div class="section"><h3>Agregar</h3><button class="link" id="close">Cerrar</button></div><form class="form" id="form">', body='';

function albumDetail(a){sheet('<div class="handle"></div><div class="section"><h3>'+a.name+'</h3><button class="link" id="close">Cerrar</button></div><div class="field"><label>Agregar fotografías</label><input id="photos" type="file" accept="image/*" multiple></div><div class="section"><h3>Fotos</h3></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">'+(a.photos.map((p,i)=>'<div class="card" style="padding:5px"><img src="'+p.data+'" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px"><button class="link" data-rmphoto="'+i+'">Eliminar</button></div>').join('')||'<p class="small">Todavía no hay fotos.</p>')+'</div><div class="section"><h3>Registro</h3></div><div class="card">'+hist(a)+'</div>');$('#close').onclick=close;$('#photos').onchange=e=>{[...e.target.files].forEach(file=>{let reader=new FileReader();reader.onload=ev=>{a.photos.push({data:ev.target.result,at:now(),who:'Nicolás'});audit(a,'Subió una foto');save();albumDetail(a)};reader.readAsDataURL(file)})};$$('[data-rmphoto]').forEach(b=>b.onclick=()=>{a.photos.splice(+b.dataset.rmphoto,1);audit(a,'Eliminó una foto');save();albumDetail(a)})}
function wishDetail(w){sheet('<div class="handle"></div><div class="section"><h3>'+w.name+'</h3><button class="link" id="close">Cerrar</button></div><div class="section"><h3>Cotizaciones</h3><button class="link" id="addquote">+ Agregar cotización</button></div><div class="card">'+(w.quotes.map((q,i)=>'<div class="activity"><strong>'+money(q.price)+'</strong><br><a href="'+q.url+'" target="_blank">Abrir cotización</a> <button class="link" data-rq="'+i+'">Eliminar</button></div>').join('')||'<p class="small">Aún no hay cotizaciones.</p>')+'</div><div class="actions"><button class="secondary" id="wedit">Editar</button><button class="secondary danger" id="wdel">Eliminar</button></div>');$('#close').onclick=close;$('#addquote').onclick=()=>{let url=prompt('Pega el link de la cotización');if(!url)return;let price=Number(prompt('Precio estimado'));w.quotes.push({url,price});audit(w,'Agregó cotización '+money(price));save();wishDetail(w)};$('[data-rq]').forEach(b=>b.onclick=()=>{w.quotes.splice(+b.dataset.rq,1);save();wishDetail(w)});$('#wedit').onclick=()=>editPopup('Editar deseo',[['Nombre',w.name]],v=>{w.name=v[0];audit(w,'Editó el deseo')});$('#wdel').onclick=()=>{if(confirm('¿Eliminar deseo?')){s.wishlist=s.wishlist.filter(x=>x.id!==w.id);save();close();render()}}}
function editPopup(title,fields,done){sheet('<div class="handle"></div><div class="section"><h3>'+title+'</h3><button class="link" id="close">Cerrar</button></div><div class="form">'+fields.map((f,i)=>'<div class="field"><label>'+f[0]+'</label><input class="editv" value="'+String(f[1]??'').replace(/"/g,'&quot;')+'"></div>').join('')+'<button class="primary" id="editsave">Guardar cambios</button></div>');$('#close').onclick=close;$('#editsave').onclick=()=>{done($('.editv').map(x=>x.value));save();close();render();toast('Cambios guardados')}}
function settings(){sheet('<div class="handle"></div><div class="section"><h3>Ajustes</h3><button class="link" id="close">Cerrar</button></div><div class="card"><strong>🗑️ Vaciar HappyHome</strong><p class="small">Borra todos los datos locales y vuelve a cero.</p><button class="secondary danger" id="reset">Eliminar todos los datos</button></div>');$('#close').onclick=close;$('#reset').onclick=()=>{if(confirm('¿Eliminar TODOS los datos?')){s=fresh();save();close();render()}}}
function bind(){
 $$('[data-add]').forEach(b=>b.onclick=()=>b.dataset.add==='compra'?purchaseForm():form(b.dataset.add));
 $$('[data-homeedit]').forEach(b=>b.onclick=homeEdit);
 $$('[data-saving]').forEach(b=>b.onclick=()=>savingDetail(s.savings.find(x=>x.id===b.dataset.saving)));
 $$('[data-shop]').forEach(b=>b.onclick=()=>shopDetail(s.shopping.find(x=>x.id===b.dataset.shop)));
 $$('[data-addinv]').forEach(b=>b.onclick=()=>inventoryAdd(b.dataset.addinv));
 $$('[data-inv]').forEach(b=>b.onclick=()=>invDetail(b.dataset.inv,s.inventory[b.dataset.inv].find(x=>x.id===b.dataset.id)));
 $$('[data-purchase]').forEach(b=>b.onclick=()=>purchaseDetail(s.purchases.find(x=>x.id===b.dataset.purchase)));
 $$('[data-bill]').forEach(b=>b.onclick=()=>billDetail(s.bills.find(x=>x.id===b.dataset.bill)));
 $$('[data-task]').forEach(b=>b.onclick=()=>taskDetail(s.tasks.find(x=>x.id===b.dataset.task)));
 $$('[data-note]').forEach(b=>b.onclick=()=>noteDetail(s.notes.find(x=>x.id===b.dataset.note)));
 $$('[data-event]').forEach(b=>b.onclick=()=>eventDetail(s.events.find(x=>x.id===b.dataset.event)));
 $$('[data-day]').forEach(b=>b.onclick=()=>form('evento',b.dataset.day));
 $('[data-wish]').forEach(b=>b.onclick=()=>wishDetail(s.wishlist.find(x=>x.id===b.dataset.wish)));$('[data-member]').forEach(b=>b.onclick=()=>{let i=+b.dataset.member;editPopup('Editar miembro',[['Nombre',s.members[i]]],v=>{s.members[i]=v[0]})});if($('#addmember'))$('#addmember').onclick=()=>{let n=prompt('Nombre del nuevo miembro');if(n){s.members.push(n);save();family()}};$('[data-album]').forEach(b=>b.onclick=()=>albumDetail(s.albums.find(x=>x.id===b.dataset.album)));
 if($('#send'))$('#send').onclick=()=>{let v=$('#msg').value.trim();if(v){s.chat.push({who:'Nicolás',text:v,at:now()});save();family()}};
}
$$('[data-nav]').forEach(b=>b.onclick=()=>{current=b.dataset.nav;render()});
$('#plus').onclick=()=>sheet('<div class="handle"></div><div class="section"><h3>Agregar</h3><button class="link" id="close">Cerrar</button></div><div class="grid"><button data-add="cuenta">💳<span>Cuenta</span></button><button data-add="compra">🛒<span>Compra</span></button><button data-add="meta">💰<span>Meta</span></button><button data-add="item">🧾<span>Lista</span></button><button data-add="nota">📝<span>Nota</span></button><button data-add="tarea">✅<span>Tarea</span></button><button data-add="evento">📅<span>Evento</span></button><button data-add="album">📸<span>Álbum</span></button></div>');
$('#bg').onclick=close;$('#profile').onclick=settings;$('#bell').onclick=()=>toast('Tus recordatorios aparecen en Inicio');document.addEventListener('click',e=>{if(e.target.id==='close')close();if(e.target.closest&&e.target.closest('[data-add]')){let b=e.target.closest('[data-add]'); b.dataset.add==='compra'?purchaseForm():form(b.dataset.add)}});
render();
</script></body></html>
