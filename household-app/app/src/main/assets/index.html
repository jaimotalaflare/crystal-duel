<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HappyHome</title><style>
:root{--text:#20242d;--muted:#8b93a1;--line:#ececf2;--pink:#f6b7c9;--lav:#d8c9f4;--mint:#cceee2;--blue:#cfe4fb;--peach:#f8dfbf}*{box-sizing:border-box}body{margin:0;background:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text)}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;padding-bottom:94px}.top{position:sticky;top:0;z-index:5;background:#fffffff2;backdrop-filter:blur(14px);padding:20px 18px 13px;border-bottom:1px solid #f1f1f4;display:flex;justify-content:space-between}.eyebrow{font-size:12px;color:var(--muted);font-weight:600}.title{font-size:24px;font-weight:750;margin-top:2px}.avatar,.icon{border:0;width:40px;height:40px;border-radius:14px;background:#f7f7fa}.avatar{background:linear-gradient(135deg,var(--pink),var(--lav));color:#fff;font-weight:800}.screen{padding:16px 16px 110px}.hero{padding:20px;border-radius:26px;background:linear-gradient(135deg,#fff1f4,#f8f4ff 55%,#eef9f5);border:1px solid #f2e8ef}.hero h1{font-size:27px;line-height:1.08;margin:8px 0}.hero p,.small{font-size:12px;color:var(--muted)}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.house{width:82px;height:70px;border-radius:22px;background:#ffffffa8;display:grid;place-items:center;font-size:36px}.section{margin:24px 2px 10px;display:flex;justify-content:space-between;align-items:center}.section h3{font-size:17px;margin:0}.link{border:0;background:transparent;color:#718ed9;font-size:12px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.quick button{border:0;border-radius:18px;min-height:80px;background:#fff1f4}.quick button:nth-child(2){background:#f4f0ff}.quick button:nth-child(3){background:#eefaf5}.quick button:nth-child(4){background:#eef6ff}.quick b{display:block;font-size:22px;margin-bottom:6px}.card,.item{border:1px solid var(--line);border-radius:19px;background:#fff;padding:14px}.stack{display:grid;gap:9px}.item{display:flex;justify-content:space-between;align-items:center;gap:10px}.main{display:flex;align-items:center;gap:10px;min-width:0}.ico{width:38px;height:38px;border-radius:13px;background:#f5f5f8;display:grid;place-items:center}.copy strong{font-size:14px;display:block}.copy small{font-size:11px;color:var(--muted)}.pill{font-size:11px;padding:6px 9px;border-radius:999px;background:#fff1df;color:#c27d3c}.green{background:#eaf8f3;color:#4c9a83}.lav{background:#f0ebff;color:#7965bd}.blue{background:#eaf4ff;color:#578fcf}.save{padding:16px;border-radius:20px;background:linear-gradient(135deg,#fff7fa,#f4f0ff,#eff9f5)}.progress{height:8px;border-radius:99px;background:#e9e9f2;overflow:hidden;margin-top:10px}.progress div{height:100%;background:linear-gradient(90deg,#e985a6,#8e78d6,#6da8e6)}.activity{padding:11px 0;border-bottom:1px solid #f1f1f4;font-size:13px}.activity:last-child{border:0}.nav{position:fixed;bottom:0;left:0;right:0;height:80px;background:#fffffff7;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 70px 1fr 1fr;align-items:center;padding:6px 8px 10px;z-index:20}.nav button{border:0;background:transparent;color:#8b93a1;display:flex;flex-direction:column;align-items:center;gap:3px}.nav small{font-size:10px}.nav .active{color:#8e78d6}.nav .fab{width:58px;height:58px;border-radius:20px;background:linear-gradient(135deg,#ef9ab4,#a891e7);color:white;font-size:30px;justify-self:center;margin-top:-24px;display:block}.tabs{display:flex;padding:4px;background:#f6f6fa;border-radius:14px;margin-bottom:14px}.tabs button{flex:1;border:0;background:transparent;border-radius:11px;padding:9px;color:#7e8693}.tabs .active{background:#fff;color:#d45f83;box-shadow:0 2px 8px #0000000d}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:11px}.tile{border:1px solid var(--line);border-radius:20px;background:#fff;text-align:left;padding:16px;min-height:110px}.tile b{display:block;margin-top:12px}.tile small{display:block;color:var(--muted);margin-top:4px}.sheetbg{position:fixed;inset:0;background:#20242d44;z-index:30}.sheet{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:28px 28px 0 0;padding:15px 16px 28px;z-index:40;max-height:85vh;overflow:auto}.hidden{display:none}.handle{width:46px;height:5px;background:#dddde5;border-radius:9px;margin:0 auto 14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.grid button{border:0;border-radius:18px;background:#fafafe;min-height:80px}.grid span{display:block;font-size:11px;margin-top:5px}.form{display:grid;gap:11px}.field label{font-size:12px;color:#626a76;font-weight:650;display:block;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;background:#fbfbfd;font-size:16px}.field textarea{min-height:80px}.primary{border:0;border-radius:14px;padding:12px 15px;color:#fff;background:linear-gradient(135deg,#e99ab3,#9d89e2);font-weight:650}.secondary{border:1px solid var(--line);border-radius:14px;padding:12px 15px;background:#fff}.clickable{cursor:pointer}.danger{color:#c84e61}.actions{display:flex;gap:8px;margin-top:14px}.actions button{flex:1}.meta{font-size:11px;color:var(--muted);margin-top:7px}.payrow,.itemrow{display:grid;grid-template-columns:1.2fr .7fr 1fr auto;gap:6px;align-items:end;margin:7px 0}.payrow input,.payrow select,.itemrow input{width:100%;box-sizing:border-box}.mini{padding:10px;border:1px solid var(--line);border-radius:12px;background:white}.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:#2d313b;color:#fff;padding:10px 14px;border-radius:12px;z-index:60;font-size:12px;white-space:nowrap}
</style></head><body><div class="app" id="app"><header class="top"><div><div class="eyebrow">HappyHome</div><div class="title" id="title">Inicio</div></div><div><button class="icon" id="bell">🔔</button> <button class="avatar" id="profile">N</button></div></header><main class="screen" id="screen"></main><nav class="nav"><button class="active" data-nav="inicio">🏠<small>Inicio</small></button><button data-nav="dinero">💰<small>Dinero</small></button><button class="fab" id="plus">＋</button><button data-nav="casa">🏡<small>Casa</small></button><button data-nav="familia">❤️<small>Familia</small></button></nav></div><div id="bg" class="sheetbg hidden"></div><section id="sheet" class="sheet hidden"></section><script>
const $=q=>document.querySelector(q), $$=q=>[...document.querySelectorAll(q)];
const money=n=>new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(Number(n)||0);
const now=()=>new Date().toLocaleString('es-CL',{dateStyle:'short',timeStyle:'short'});
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const SB_URL='https://ajsebweqcebdumbqsuns.supabase.co',SB_KEY='sb_publishable_SZv_HOAKMN9EKO1hcD4Oqw_KS8X09tN';

async function rpc(fn,args){let res=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(args||{})});let body=null,text=await res.text();try{body=text?JSON.parse(text):null}catch(e){body=text}if(!res.ok)return {data:null,error:{message:(body&&body.message)||text||('HTTP '+res.status)}};return {data:body,error:null}}
const sb={rpc};

let cloudHouse=null,currentMember='Miembro',syncTimer=null,cloudLoading=false,channel=null;
function deviceToken(){let t=localStorage.getItem('hh-device-token');if(!t){t=([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g,x=>(x^crypto.getRandomValues(new Uint8Array(1))[0]&15>>x/4).toString(16));localStorage.setItem('hh-device-token',t)}return t}
let myDevice=null;
async function cloudBoot(){document.querySelector('#app').style.display='';let boot=await rpc('device_bootstrap',{p_device_token:deviceToken(),p_display_name:localStorage.getItem('hh-name')||'Miembro'});if(boot.data){myDevice=boot.data;currentMember=myDevice.display_name}let ses=await rpc('device_get_session',{p_device_token:deviceToken()});if(ses.data&&ses.data.status==='active'){cloudHouse={id:ses.data.household_id,name:ses.data.name,message:ses.data.message,updated_at:ses.data.updated_at};s=Object.assign(fresh(),ses.data.state||{});s.home={name:ses.data.name,message:ses.data.message};await refreshMembers();localStorage.setItem('happyhome-v04',JSON.stringify(s));startPolling()}else{s=load()}render()}
async function refreshMembers(){let {data}=await rpc('device_list_members',{p_device_token:deviceToken()});if(data&&data.length)s.members=data.filter(x=>x.status==='active').map(x=>x.display_name)}
function startPolling(){clearInterval(window.hhPoll);window.hhPoll=setInterval(async()=>{let {data}=await rpc('device_get_session',{p_device_token:deviceToken()});if(!data||data.status!=='active')return;if(!cloudHouse||data.updated_at!==cloudHouse.updated_at){cloudHouse={id:data.household_id,name:data.name,message:data.message,updated_at:data.updated_at};s=Object.assign(fresh(),data.state||{});s.home={name:data.name,message:data.message};await refreshMembers();localStorage.setItem('happyhome-v04',JSON.stringify(s));render()}},3000)}
async function friendsPanel(){let {data:list}=await rpc('friend_list',{p_device_token:deviceToken()});list=list||[];let active=list.filter(x=>x.status==='active'),incoming=list.filter(x=>x.status==='pending'&&x.direction==='received');sheet('<div class="handle"></div><div class="section"><h3>Personas y hogar</h3><button class="link" id="close">Cerrar</button></div><div class="card"><p class="small">Tu código para agregar amigos</p><h2 style="letter-spacing:3px">'+(myDevice?.friend_code||'')+'</h2><div class="field"><label>Tu nombre</label><input id="myname" value="'+(myDevice?.display_name||currentMember)+'"></div><button class="secondary" id="savename">Guardar nombre</button></div><div class="section"><h3>Agregar persona</h3></div><div class="card"><div class="field"><label>Código de amigo</label><input id="friendcode" placeholder="XXXXXXXX"></div><button class="primary" id="addfriend">Enviar solicitud</button></div>'+(incoming.length?'<div class="section"><h3>Solicitudes</h3></div><div class="card">'+incoming.map(x=>'<div class="activity row"><strong>'+x.display_name+'</strong><span><button class="link" data-fa="'+x.device_token+'">Aceptar</button><button class="link" data-fr="'+x.device_token+'">Rechazar</button></span></div>').join('')+'</div>':'')+'<div class="section"><h3>Amigos</h3></div><div class="card">'+(active.map(x=>'<div class="activity">👤 <strong>'+x.display_name+'</strong></div>').join('')||'<p class="small">Todavía no tienes amigos agregados.</p>')+'</div><div class="section"><h3>'+ (cloudHouse?'Hogar actual':'Crear hogar compartido') +'</h3></div>'+(cloudHouse?'<div class="card"><strong>'+s.home.name+'</strong><p class="small">Sincronizado entre los miembros de este hogar.</p></div>':'<div class="card"><div class="field"><label>Nombre del hogar</label><input id="pairhouse" placeholder="La Famille"></div><div class="field"><label>Crear con</label><select id="pairfriend"><option value="">Solo yo por ahora</option>'+active.map(x=>'<option value="'+x.device_token+'">'+x.display_name+'</option>').join('')+'</select></div><button class="primary" id="makepair">Crear hogar</button></div>'));$('#close').onclick=close;$('#savename').onclick=async()=>{let n=$('#myname').value.trim();if(n){await rpc('device_set_name',{p_device_token:deviceToken(),p_display_name:n});localStorage.setItem('hh-name',n);myDevice.display_name=n;currentMember=n;toast('Nombre actualizado')}};$('#addfriend').onclick=async()=>{let {error}=await rpc('friend_request',{p_device_token:deviceToken(),p_friend_code:$('#friendcode').value});if(error)return toast(error.message);toast('Solicitud enviada');friendsPanel()};$$('[data-fa]').forEach(b=>b.onclick=async()=>{await rpc('friend_respond',{p_device_token:deviceToken(),p_other:b.dataset.fa,p_accept:true});friendsPanel()});$$('[data-fr]').forEach(b=>b.onclick=async()=>{await rpc('friend_respond',{p_device_token:deviceToken(),p_other:b.dataset.fr,p_accept:false});friendsPanel()});if($('#makepair'))$('#makepair').onclick=async()=>{let name=$('#pairhouse').value.trim()||'Mi hogar',fr=$('#pairfriend').value||null,base=JSON.parse(JSON.stringify(s));let {data,error}=await rpc('pair_create_house',{p_device_token:deviceToken(),p_name:name,p_friend:fr,p_state:base});if(error)return toast(error.message);close();await cloudBoot();toast('Hogar creado y sincronizado')}}
function subscribeHouse(){}
async function pushCloud(){if(!cloudHouse)return;let payload=JSON.parse(JSON.stringify(s));delete payload.home;let {error}=await rpc('device_update_house',{p_device_token:deviceToken(),p_state:payload,p_name:s.home.name,p_message:s.home.message});if(error)toast('No se pudo sincronizar');else cloudHouse.updated_at=new Date().toISOString()}
function cloudSoon(){clearTimeout(syncTimer);syncTimer=setTimeout(pushCloud,350)}
async function showCloudSettings(){return friendsPanel()}
function settings(){return friendsPanel();sheet('<div class="handle"></div><div class="section"><h3>Ajustes</h3><button class="link" id="close">Cerrar</button></div><div class="card"><strong>🗑️ Vaciar HappyHome</strong><p class="small">Borra todos los datos locales y vuelve a cero.</p><button class="secondary danger" id="reset">Eliminar todos los datos</button></div>');$('#close').onclick=close;$('#reset').onclick=()=>{if(confirm('¿Eliminar TODOS los datos?')){s=fresh();save();close();render()}}}
function bind(){
 $$('[data-add]').forEach(b=>b.onclick=()=>b.dataset.add==='compra'?purchaseForm():form(b.dataset.add));
 $$('[data-homeedit]').forEach(b=>b.onclick=homeEdit);
 $$('[data-saving]').forEach(b=>b.onclick=()=>savingDetail(s.savings.find(x=>x.id===b.dataset.saving)));
 $$('[data-shop]').forEach(b=>b.onclick=()=>shopDetail(s.shopping.find(x=>x.id===b.dataset.shop)));
 $$('[data-addinv]').forEach(b=>b.onclick=()=>inventoryAdd(b.dataset.addinv));
 $$('[data-inv]').forEach(b=>b.onclick=()=>invDetail(b.dataset.inv,s.inventory[b.dataset.inv].find(x=>x.id===b.dataset.id)));
 $$('[data-purchase]').forEach(b=>b.onclick=()=>purchaseDetail(s.purchases.find(x=>x.id===b.dataset.purchase)));
 $$('[data-bill]').forEach(b=>b.onclick=()=>billDetail(s.bills.find(x=>x.id===b.dataset.bill)));
 $$('[data-task]').forEach(b=>b.onclick=()=>taskDetail(s.tasks.find(x=>x.id===b.dataset.task)));
 $$('[data-note]').forEach(b=>b.onclick=()=>noteDetail(s.notes.find(x=>x.id===b.dataset.note)));
 $$('[data-event]').forEach(b=>b.onclick=()=>eventDetail(s.events.find(x=>x.id===b.dataset.event)));
 $$('[data-day]').forEach(b=>b.onclick=()=>form('evento',b.dataset.day));
 $('[data-wish]').forEach(b=>b.onclick=()=>wishDetail(s.wishlist.find(x=>x.id===b.dataset.wish)));$('[data-member]').forEach(b=>b.onclick=()=>{let i=+b.dataset.member;editPopup('Editar miembro',[['Nombre',s.members[i]]],v=>{s.members[i]=v[0]})});if($('#addmember'))$('#addmember').onclick=()=>{let n=prompt('Nombre del nuevo miembro');if(n){s.members.push(n);save();family()}};$('[data-album]').forEach(b=>b.onclick=()=>albumDetail(s.albums.find(x=>x.id===b.dataset.album)));
 if($('#send'))$('#send').onclick=()=>{let v=$('#msg').value.trim();if(v){s.chat.push({who:currentMember,text:v,at:now()});save();family()}};
}
$$('[data-nav]').forEach(b=>b.onclick=()=>{current=b.dataset.nav;render()});
$('#plus').onclick=()=>sheet('<div class="handle"></div><div class="section"><h3>Agregar</h3><button class="link" id="close">Cerrar</button></div><div class="grid"><button data-add="cuenta">💳<span>Cuenta</span></button><button data-add="compra">🛒<span>Compra</span></button><button data-add="meta">💰<span>Meta</span></button><button data-add="item">🧾<span>Lista</span></button><button data-add="nota">📝<span>Nota</span></button><button data-add="tarea">✅<span>Tarea</span></button><button data-add="evento">📅<span>Evento</span></button><button data-add="album">📸<span>Álbum</span></button></div>');
$('#bg').onclick=close;$('#profile').onclick=settings;$('#bell').onclick=()=>toast('Tus recordatorios aparecen en Inicio');document.addEventListener('click',e=>{if(e.target.id==='close')close();if(e.target.closest&&e.target.closest('[data-add]')){let b=e.target.closest('[data-add]'); b.dataset.add==='compra'?purchaseForm():form(b.dataset.add)}});
document.querySelector('#app').style.display='none';cloudBoot();
</script></body></html>
