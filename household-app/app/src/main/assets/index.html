<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HappyHome</title><style>
:root{--text:#20242d;--muted:#8b93a1;--line:#ececf2;--pink:#f6b7c9;--lav:#d8c9f4;--mint:#cceee2;--blue:#cfe4fb;--peach:#f8dfbf}*{box-sizing:border-box}body{margin:0;background:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text)}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;padding-bottom:94px}.top{position:sticky;top:0;z-index:5;background:#fffffff2;backdrop-filter:blur(14px);padding:20px 18px 13px;border-bottom:1px solid #f1f1f4;display:flex;justify-content:space-between}.eyebrow{font-size:12px;color:var(--muted);font-weight:600}.title{font-size:24px;font-weight:750;margin-top:2px}.avatar,.icon{border:0;width:40px;height:40px;border-radius:14px;background:#f7f7fa}.avatar{background:linear-gradient(135deg,var(--pink),var(--lav));color:#fff;font-weight:800}.screen{padding:16px 16px 110px}.hero{padding:20px;border-radius:26px;background:linear-gradient(135deg,#fff1f4,#f8f4ff 55%,#eef9f5);border:1px solid #f2e8ef}.hero h1{font-size:27px;line-height:1.08;margin:8px 0}.hero p,.small{font-size:12px;color:var(--muted)}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.house{width:82px;height:70px;border-radius:22px;background:#ffffffa8;display:grid;place-items:center;font-size:36px}.section{margin:24px 2px 10px;display:flex;justify-content:space-between;align-items:center}.section h3{font-size:17px;margin:0}.link{border:0;background:transparent;color:#718ed9;font-size:12px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.quick button{border:0;border-radius:18px;min-height:80px;background:#fff1f4}.quick button:nth-child(2){background:#f4f0ff}.quick button:nth-child(3){background:#eefaf5}.quick button:nth-child(4){background:#eef6ff}.quick b{display:block;font-size:22px;margin-bottom:6px}.card,.item{border:1px solid var(--line);border-radius:19px;background:#fff;padding:14px}.stack{display:grid;gap:9px}.item{display:flex;justify-content:space-between;align-items:center;gap:10px}.main{display:flex;align-items:center;gap:10px;min-width:0}.ico{width:38px;height:38px;border-radius:13px;background:#f5f5f8;display:grid;place-items:center}.copy strong{font-size:14px;display:block}.copy small{font-size:11px;color:var(--muted)}.pill{font-size:11px;padding:6px 9px;border-radius:999px;background:#fff1df;color:#c27d3c}.green{background:#eaf8f3;color:#4c9a83}.lav{background:#f0ebff;color:#7965bd}.blue{background:#eaf4ff;color:#578fcf}.save{padding:16px;border-radius:20px;background:linear-gradient(135deg,#fff7fa,#f4f0ff,#eff9f5)}.progress{height:8px;border-radius:99px;background:#e9e9f2;overflow:hidden;margin-top:10px}.progress div{height:100%;background:linear-gradient(90deg,#e985a6,#8e78d6,#6da8e6)}.activity{padding:11px 0;border-bottom:1px solid #f1f1f4;font-size:13px}.activity:last-child{border:0}.nav{position:fixed;bottom:0;left:0;right:0;height:80px;background:#fffffff7;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 70px 1fr 1fr;align-items:center;padding:6px 8px 10px;z-index:20}.nav button{border:0;background:transparent;color:#8b93a1;display:flex;flex-direction:column;align-items:center;gap:3px}.nav small{font-size:10px}.nav .active{color:#8e78d6}.nav .fab{width:58px;height:58px;border-radius:20px;background:linear-gradient(135deg,#ef9ab4,#a891e7);color:white;font-size:30px;justify-self:center;margin-top:-24px;display:block}.tabs{display:flex;padding:4px;background:#f6f6fa;border-radius:14px;margin-bottom:14px}.tabs button{flex:1;border:0;background:transparent;border-radius:11px;padding:9px;color:#7e8693}.tabs .active{background:#fff;color:#d45f83;box-shadow:0 2px 8px #0000000d}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:11px}.tile{border:1px solid var(--line);border-radius:20px;background:#fff;text-align:left;padding:16px;min-height:110px}.tile b{display:block;margin-top:12px}.tile small{display:block;color:var(--muted);margin-top:4px}.sheetbg{position:fixed;inset:0;background:#20242d44;z-index:30}.sheet{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:28px 28px 0 0;padding:15px 16px 28px;z-index:40;max-height:85vh;overflow:auto}.hidden{display:none}.handle{width:46px;height:5px;background:#dddde5;border-radius:9px;margin:0 auto 14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.grid button{border:0;border-radius:18px;background:#fafafe;min-height:80px}.grid span{display:block;font-size:11px;margin-top:5px}.form{display:grid;gap:11px}.field label{font-size:12px;color:#626a76;font-weight:650;display:block;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;background:#fbfbfd;font-size:16px}.field textarea{min-height:80px}.primary{border:0;border-radius:14px;padding:12px 15px;color:#fff;background:linear-gradient(135deg,#e99ab3,#9d89e2);font-weight:650}.secondary{border:1px solid var(--line);border-radius:14px;padding:12px 15px;background:#fff}.clickable{cursor:pointer}.danger{color:#c84e61}.actions{display:flex;gap:8px;margin-top:14px}.actions button{flex:1}.meta{font-size:11px;color:var(--muted);margin-top:7px}.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:#2d313b;color:#fff;padding:10px 14px;border-radius:12px;z-index:60;font-size:12px;white-space:nowrap}
</style></head><body><div class="app"><header class="top"><div><div class="eyebrow">HappyHome</div><div class="title" id="title">Inicio</div></div><div><button class="icon" id="bell">🔔</button> <button class="avatar" id="profile">N</button></div></header><main class="screen" id="screen"></main><nav class="nav"><button class="active" data-nav="inicio">🏠<small>Inicio</small></button><button data-nav="dinero">💰<small>Dinero</small></button><button class="fab" id="plus">＋</button><button data-nav="casa">🏡<small>Casa</small></button><button data-nav="familia">❤️<small>Familia</small></button></nav></div><div id="bg" class="sheetbg hidden"></div><section id="sheet" class="sheet hidden"></section><script>
const emptyState=()=>({bills:[],saving:{name:'Mi primera meta',total:0,goal:0,history:[]},shopping:[],fridge:[],tasks:[],notes:[],expenses:[],activity:[],albums:[],chat:[]});let s;try{s=JSON.parse(localStorage.getItem('casa'))||emptyState()}catch(e){s=emptyState()};let current='inicio';const $=q=>document.querySelector(q),money=n=>new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(n);function save(){localStorage.setItem('casa',JSON.stringify(s))}function stamp(){return new Date().toLocaleString('es-CL',{dateStyle:'short',timeStyle:'short'})}function log(a){s.activity.unshift('Nicolás · '+stamp()+' · '+a)}function empty(m,b){return '<div class="card"><strong>'+m+'</strong><p class="small">'+b+'</p></div>'}function toast(t){let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),1600)}function title(t){$('#title').textContent=t}function render(){$('#profile').onclick=settings;document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===current));if(current==='inicio')home();if(current==='dinero')moneyScreen();if(current==='casa')house();if(current==='familia')family()}
function home(){title('Inicio');let p=s.saving.goal?Math.round(s.saving.total/s.saving.goal*100):0,pending=s.bills.filter(x=>x.status!=='Pagado');$('#screen').innerHTML=`<div class="hero"><div class="row"><div><div class="eyebrow">Buenos días ☀️</div><h1>Juntos hacemos<br>un gran hogar.</h1><p>${pending.length} cuentas próximas · ${s.shopping.filter(x=>!x[2]).length} compras pendientes</p></div><div class="house">🏡</div></div></div><div class="section"><h3>Acciones rápidas</h3></div><div class="quick"><button data-add="gasto"><b>🛒</b>Compra</button><button data-add="cuenta"><b>💳</b>Cuenta</button><button data-add="nota"><b>📝</b>Nota</button><button data-add="foto"><b>📸</b>Foto</button></div><div class="section"><h3>Hoy en casa</h3></div><div class="stack">${s.tasks.slice(0,2).map((x,i)=>`<div class="item clickable" data-open="task" data-i="${i}"><div class="main"><div class="ico">🔔</div><div class="copy"><strong>${x[0]}</strong><small>${x[1]} · ${x[2]}</small></div></div><span class="pill lav">Pendiente</span></div>`).join('')}${pending.slice(0,2).map(x=>`<div class="item"><div class="main"><div class="ico">${x.icon}</div><div class="copy"><strong>${x.name}</strong><small>Vence ${x.due}</small></div></div><strong>${money(x.amount)}</strong></div>`).join('')}</div><div class="section"><h3>Ahorro del hogar</h3></div><div class="save"><div class="row"><div><div class="eyebrow">Meta</div><strong>${s.saving.name}</strong><div>${money(s.saving.total)}</div></div><strong>${p}%</strong></div><div class="progress"><div style="width:${p}%"></div></div></div><div class="section"><h3>Actividad reciente</h3></div><div class="card">${s.activity.slice(0,5).map((x,i)=>`<div class="activity clickable" data-open="activity" data-i="${i}">✨ ${x}</div>`).join('')}</div>`;bindAdds()}
function moneyScreen(){title('Dinero');$('#screen').innerHTML='<div class="tabs"><button class="active" data-m="cuentas">Cuentas</button><button data-m="gastos">Gastos</button><button data-m="ahorro">Ahorros</button></div><div id="panel"></div>';moneyTab('cuentas');document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-m]').forEach(x=>x.classList.remove('active'));b.classList.add('active');moneyTab(b.dataset.m)})}function moneyTab(t){let p=$('#panel');if(t==='cuentas')p.innerHTML='<div class="section"><h3>Cuentas del mes</h3><button class="link" data-add="cuenta">+ Agregar</button></div><div class="stack">'+s.bills.map((x,i)=>`<div class="item clickable" data-open="bill" data-i="${i}"><div class="main"><div class="ico">${x.icon}</div><div class="copy"><strong>${x.name}</strong><small>Vence ${x.due}</small></div></div><div><strong>${money(x.amount)}</strong><br><span class="pill ${x.status==='Pagado'?'green':''}">${x.status}</span></div></div>`).join('')+'</div>';if(t==='gastos')p.innerHTML='<div class="section"><h3>Gastos compartidos</h3><button class="link" data-add="gasto">+ Registrar</button></div>'+s.expenses.map((x,i)=>`<div class="card clickable" data-open="expense" data-i="${i}"><div class="row"><div><div class="eyebrow">${x.place}</div><strong>${x.title}</strong></div><strong>${money(x.amount)}</strong></div><p class="small">Pagado por ${x.paid}</p><div class="item"><span>Nicolás</span><span>${money(x.amount/2)} ✅</span></div><div class="item"><span>Alejandra</span><span>${money(x.amount/2)} ${x.alePaid?'✅':'⏳'}</span></div>${x.alePaid?'':`<button class="primary" style="width:100%;margin-top:10px" data-pay="${i}">Invitar a pagar a Alejandra</button>`}</div>`).join('');if(t==='ahorro'){let q=s.saving.goal?Math.round(s.saving.total/s.saving.goal*100):0;p.innerHTML=`<div class="section"><h3>Meta de ahorro</h3><button class="link" data-add="ahorro">+ Aporte</button></div><div class="save"><strong>${s.saving.name}</strong><h2>${money(s.saving.total)}</h2><div class="progress"><div style="width:${q}%"></div></div><p class="small">Meta ${money(s.saving.goal)}</p></div><div class="section"><h3>Historial</h3></div><div class="card">${s.saving.history.map(x=>`<div class="activity"><strong>${x[0]}</strong> aportó ${money(x[1])}</div>`).join('')}</div>`}bindAdds();document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{s.expenses[+b.dataset.pay].alePaid=true;log('Alejandra confirmó su parte de '+s.expenses[+b.dataset.pay].title);save();moneyTab('gastos');toast('Pago confirmado')})}
function house(){title('Casa');$('#screen').innerHTML=`<div class="tiles"><button class="tile" data-h="compras">🛒<b>Lista de compras</b><small>${s.shopping.filter(x=>!x[2]).length} pendientes</small></button><button class="tile" data-h="refri">🧊<b>Refrigerador</b><small>${s.fridge.length} productos</small></button><button class="tile" data-h="tareas">✅<b>Tareas</b><small>${s.tasks.filter(x=>!x[3]).length} pendientes</small></button><button class="tile" data-h="notas">📝<b>Notas</b><small>${s.notes.length} notas</small></button><button class="tile" data-h="cal">📅<b>Calendario</b><small>Eventos y recordatorios</small></button><button class="tile" data-h="despensa">🥫<b>Despensa</b><small>Inventario simple</small></button></div><div id="hp"></div>`;document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>houseTab(b.dataset.h));houseTab('compras')}function houseTab(t){let p=$('#hp');if(t==='compras')p.innerHTML='<div class="section"><h3>Lista de compras</h3><button class="link" data-add="producto">+ Agregar</button></div><div class="card">'+s.shopping.map((x,i)=>`<div class="activity clickable" data-open="shop" data-i="${i}"><input type="checkbox" data-shop="${i}" ${x[2]?'checked':''}> <strong>${x[0]}</strong> ×${x[1]}</div>`).join('')+'</div>';if(t==='refri')p.innerHTML='<div class="section"><h3>Refrigerador</h3></div><div class="stack">'+s.fridge.map((x,i)=>`<div class="item clickable" data-open="fridge" data-i="${i}"><div class="main"><div class="ico">${x[3]}</div><div class="copy"><strong>${x[0]}</strong><small>${x[2]?'Vence '+x[2]:'Sin fecha'}</small></div></div><span class="pill">${x[1]}</span></div>`).join('')+'</div>';if(t==='tareas'||t==='cal')p.innerHTML='<div class="section"><h3>Tareas y recordatorios</h3><button class="link" data-add="tarea">+ Tarea</button></div><div class="stack">'+s.tasks.map((x,i)=>`<div class="item clickable" data-open="task" data-i="${i}"><label><input type="checkbox" data-task="${i}" ${x[3]?'checked':''}> <strong>${x[0]}</strong><div class="small">${x[1]} · ${x[2]}</div></label><span class="pill blue">🔔</span></div>`).join('')+'</div>';if(t==='notas')p.innerHTML='<div class="section"><h3>Notas</h3><button class="link" data-add="nota">+ Nota</button></div><div class="stack">'+s.notes.map((x,i)=>`<div class="card clickable" data-open="note" data-i="${i}"><strong>${x[0]}</strong><p class="small">${x[1]}</p>${x[2]?'<span class="pill blue">🔔 '+x[2]+'</span>':''}</div>`).join('')+'</div>';if(t==='despensa')p.innerHTML='<div class="section"><h3>Despensa</h3></div><div class="card">Inventario simple: Hay · Queda poco · Se terminó.</div>';bindAdds();document.querySelectorAll('[data-shop]').forEach(b=>b.onchange=()=>{s.shopping[+b.dataset.shop][2]=b.checked;log((b.checked?'marcó como comprado ':'reabrió ')+s.shopping[+b.dataset.shop][0]);save()});document.querySelectorAll('[data-task]').forEach(b=>b.onchange=()=>{s.tasks[+b.dataset.task][3]=b.checked;log((b.checked?'completó ':'reabrió ')+s.tasks[+b.dataset.task][0]);save()})}
function family(){title('Familia');$('#screen').innerHTML='<div class="tabs"><button class="active" data-f="act">Actividad</button><button data-f="fotos">Fotos</button><button data-f="chat">Chat</button></div><div id="fp"></div>';familyTab('act');document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-f]').forEach(x=>x.classList.remove('active'));b.classList.add('active');familyTab(b.dataset.f)})}function familyTab(t){let p=$('#fp');if(t==='act')p.innerHTML='<div class="section"><h3>Nuestra familia ❤️</h3></div><div class="card"><div class="activity">N · <strong>Nicolás</strong></div><div class="activity">A · <strong>Alejandra</strong></div></div><div class="section"><h3>Actividad</h3></div><div class="card">'+s.activity.map(x=>'<div class="activity">✨ '+x+'</div>').join('')+'</div>';if(t==='fotos')p.innerHTML='<div class="section"><h3>Álbumes</h3><button class="link" data-add="foto">+ Subir</button></div><div class="tiles">'+s.albums.map(x=>`<div class="tile"><div style="font-size:30px">${x[2]}</div><b>${x[0]}</b><small>${x[1]} fotos</small></div>`).join('')+'</div>';if(t==='chat')p.innerHTML='<div class="section"><h3>Chat del hogar</h3></div><div class="card">'+s.chat.map(x=>`<div class="activity"><strong>${x[0]}:</strong> ${x[1]}</div>`).join('')+'<div class="row" style="margin-top:10px"><input id="msg" style="flex:1;border:1px solid var(--line);border-radius:14px;padding:12px" placeholder="Escribe un mensaje"><button class="primary" id="send">Enviar</button></div></div>';bindAdds();if($('#send'))$('#send').onclick=()=>{let v=$('#msg').value.trim();if(v){s.chat.push(['Nico',v]);save();familyTab('chat')}}}
function settings(){sheet('<div class="handle"></div><div class="section"><h3>Ajustes y datos</h3><button class="link" id="close">Cerrar</button></div><div class="card"><strong>🗑️ Vaciar datos del hogar</strong><p class="small">Elimina todos los datos registrados en este dispositivo y vuelve a empezar desde cero.</p><button class="secondary" style="width:100%;color:#c84e61" id="reset">Eliminar todos los datos</button></div>');$('#close').onclick=close;$('#reset').onclick=()=>{if(confirm('¿Seguro? Se eliminarán TODOS los datos del hogar.')){s=emptyState();save();close();render();toast('Hogar vacío')}}}
function bindAdds(){document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>form(b.dataset.add));document.querySelectorAll('[data-open]').forEach(b=>b.onclick=e=>{if(e.target.matches('input'))return;detail(b.dataset.open,+b.dataset.i)})}
function detail(t,i){let x,title='',body='',fields='';if(t==='activity'){x=s.activity[i];title='Registro de actividad';body=x;fields='<div class="meta">Este registro documenta quién hizo qué y cuándo.</div>'}if(t==='expense'){x=s.expenses[i];title=x.title;body=money(x.amount)+' · '+x.place+' · Pagado por '+x.paid;fields='<div class="field"><label>Compra</label><input id="en" value="'+x.title+'"></div><div class="field"><label>Monto</label><input id="ev" type="number" value="'+x.amount+'"></div>'}if(t==='shop'){x=s.shopping[i];title=x[0];body='Cantidad: '+x[1]+' · '+(x[2]?'Comprado':'Pendiente');fields='<div class="field"><label>Producto</label><input id="en" value="'+x[0]+'"></div><div class="field"><label>Cantidad</label><input id="ev" value="'+x[1]+'"></div>'}if(t==='fridge'){x=s.fridge[i];title=x[0];body='Estado: '+x[1]+' · '+(x[2]||'Sin vencimiento');fields='<div class="field"><label>Producto</label><input id="en" value="'+x[0]+'"></div><div class="field"><label>Estado</label><select id="ev"><option>Hay</option><option>Queda poco</option><option>Se terminó</option></select></div>'}if(t==='task'){x=s.tasks[i];title=x[0];body=x[1]+' · '+x[2];fields='<div class="field"><label>Tarea</label><input id="en" value="'+x[0]+'"></div><div class="field"><label>Fecha / hora</label><input id="ev" value="'+x[1]+'"></div>'}if(t==='note'){x=s.notes[i];title=x[0];body=x[1]||'Sin detalle';fields='<div class="field"><label>Título</label><input id="en" value="'+x[0]+'"></div><div class="field"><label>Detalle</label><textarea id="ev">'+(x[1]||'')+'</textarea></div>'}if(t==='bill'){x=s.bills[i];title=x.name;body=money(x.amount)+' · '+x.status+' · '+x.due;fields='<div class="field"><label>Nombre</label><input id="en" value="'+x.name+'"></div><div class="field"><label>Monto</label><input id="ev" type="number" value="'+x.amount+'"></div>'}sheet('<div class="handle"></div><div class="section"><h3>'+title+'</h3><button class="link" id="close">Cerrar</button></div><p class="small">'+body+'</p><div class="form">'+fields+'</div><div class="actions"><button class="secondary" id="edit">Guardar cambios</button><button class="secondary danger" id="del">Eliminar</button></div><div class="meta">Los cambios quedan registrados con usuario, fecha y hora.</div>');$('#close').onclick=close;$('#edit').onclick=()=>{if(t==='activity'){close();return}let n=$('#en').value,v=$('#ev').value;if(t==='shop'){x[0]=n;x[1]=v}if(t==='fridge'){x[0]=n;x[1]=v}if(t==='task'){x[0]=n;x[1]=v}if(t==='note'){x[0]=n;x[1]=v}if(t==='bill'){x.name=n;x.amount=+v}if(t==='expense'){x.title=n;x.amount=+v}log('editó '+title);save();close();render();toast('Cambios guardados')};$('#del').onclick=()=>{if(!confirm('¿Eliminar '+title+'?'))return;let map={shop:'shopping',fridge:'fridge',task:'tasks',note:'notes',bill:'bills',expense:'expenses'};s[map[t]].splice(i,1);log('eliminó '+title);save();close();render();toast('Eliminado')}}function quick(){sheet(`<div class="handle"></div><div class="section"><h3>¿Qué quieres agregar?</h3><button class="link" id="close">Cerrar</button></div><div class="grid"><button data-add="cuenta">💳<span>Cuenta</span></button><button data-add="gasto">🛒<span>Compra</span></button><button data-add="ahorro">💰<span>Aporte</span></button><button data-add="nota">📝<span>Nota</span></button><button data-add="tarea">✅<span>Tarea</span></button><button data-add="evento">📅<span>Evento</span></button><button data-add="producto">🥫<span>Producto</span></button><button data-add="foto">📸<span>Foto</span></button></div>`);bindAdds();$('#close').onclick=close}
function sheet(h){$('#sheet').innerHTML=h;$('#sheet').classList.remove('hidden');$('#bg').classList.remove('hidden')}function close(){$('#sheet').classList.add('hidden');$('#bg').classList.add('hidden')}function form(t){let body='';if(t==='cuenta')body='<div class="field"><label>Nombre</label><input name="name" required></div><div class="field"><label>Monto</label><input name="amount" type="number" required></div><div class="field"><label>Vencimiento</label><input name="due" type="date"></div>';if(t==='gasto')body='<div class="field"><label>Compra</label><input name="name" required placeholder="Supermercado"></div><div class="field"><label>Lugar</label><input name="place"></div><div class="field"><label>Total</label><input name="amount" type="number" required></div><div class="field"><label>Boleta/comprobante</label><input name="file" type="file" accept="image/*,.pdf"></div>';if(t==='ahorro')body='<div class="field"><label>Monto</label><input name="amount" type="number" required></div><div class="field"><label>Aportado por</label><select name="who"><option>Nicolás</option><option>Alejandra</option></select></div>';if(t==='nota')body='<div class="field"><label>Título</label><input name="name" required></div><div class="field"><label>Nota</label><textarea name="body"></textarea></div><div class="field"><label>Recordatorio</label><input name="when" placeholder="Mañana 18:00"></div>';if(t==='tarea'||t==='evento')body='<div class="field"><label>Nombre</label><input name="name" required></div><div class="field"><label>Fecha / hora</label><input name="when" placeholder="Domingo · 11:00"></div><div class="field"><label>Para</label><select name="who"><option>Nico y Ale</option><option>Nicolás</option><option>Alejandra</option></select></div>';if(t==='producto')body='<div class="field"><label>Producto</label><input name="name" required></div><div class="field"><label>Cantidad</label><input name="qty" value="1"></div>';if(t==='foto')body='<div class="field"><label>Álbum</label><input name="name" required></div><div class="field"><label>Elegir foto</label><input name="file" type="file" accept="image/*"></div>';sheet(`<div class="handle"></div><div class="section"><h3>Agregar</h3><button class="link" id="close">Cerrar</button></div><form class="form" id="form">${body}<button class="primary">Guardar</button></form>`);$('#close').onclick=close;$('#form').onsubmit=e=>{e.preventDefault();let d=new FormData(e.target),n=d.get('name');if(t==='cuenta')s.bills.push({name:n,amount:+d.get('amount'),status:'Pendiente',due:d.get('due')||'Sin fecha',icon:'💳'});if(t==='gasto')s.expenses.unshift({title:n,place:d.get('place')||'Compra',amount:+d.get('amount'),paid:'Nicolás',alePaid:false});if(t==='ahorro'){let a=+d.get('amount');s.saving.total+=a;s.saving.history.unshift([d.get('who'),a])}if(t==='nota')s.notes.unshift([n,d.get('body'),d.get('when')]);if(t==='tarea'||t==='evento')s.tasks.unshift([n,d.get('when')||'Sin fecha',d.get('who'),false]);if(t==='producto')s.shopping.unshift([n,d.get('qty')||'1',false]);if(t==='foto'){let a=s.albums.find(x=>x[0].toLowerCase()===String(n).toLowerCase());a?a[1]++:s.albums.unshift([n,1,'📷'])}log('agregó '+(n||'un aporte'));save();close();render();toast('Guardado')}}
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{current=b.dataset.nav;render()});$('#plus').onclick=quick;$('#bg').onclick=close;$('#bell').onclick=()=>toast('2 recordatorios · 1 cuenta próxima');render();
</script></body></html>
